<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File an RTI | BHARAT PRAMAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    .letter { font-family: 'Source Serif 4', Georgia, serif; line-height: 1.65; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = window.location.origin;
    const ID = new URLSearchParams(window.location.search).get("id");

    // Rule lists. Edit these to match what the profile page actually shows.
    const ALREADY = [
      { words: ["asset", "property", "wealth", "liabilit", "loan", "debt"], text: "Assets and liabilities are already shown on the profile." },
      { words: ["criminal", "fir", "case", "convict"], text: "Criminal cases from the affidavit are already shown on the profile." },
      { words: ["education", "qualification", "degree"], text: "Education details are already shown on the profile." },
      { words: ["how old", "born", "birth"], text: "Age is already shown on the profile." },
      { words: ["party"], text: "Party membership is already shown on the profile." },
    ];
    const PRIVATE = ["wife", "husband", "spouse", "son", "daughter", "family", "child", "mother", "father", "brother", "sister", "phone", "mobile", "home address", "aadhaar", "pan card", "bank account", "medical", "health", "caste", "religion"];
    const OPINION = ["corrupt", "honest", "best mp", "worst mp", "good mp", "bad mp", "do you think"];

    const hit = (text, words) => words.some(w => new RegExp("\\b" + w).test(text));

    function checkQuestion(q) {
      const t = q.toLowerCase().trim();
      if (!t) return null;
      for (const r of ALREADY) if (hit(t, r.words)) return { kind: "already", text: r.text + " You don't need an RTI for this." };
      if (hit(t, PRIVATE)) return { kind: "private", text: "RTI covers records that public authorities hold about public duties and public money. Personal details of private individuals, including family members, are usually refused. Try asking about funds, attendance or allowances instead." };
      if (hit(t, OPINION)) return { kind: "opinion", text: "An RTI can ask for records, not opinions or judgments. Rephrase it as a request for a specific record, for example the list of works sanctioned, with amounts." };
      return { kind: "ok", text: "No problems found. Ask for a specific record and give a date range." };
    }

    const fmt = (iso) => new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
    const tone = { already: "bg-sky-50 border-sky-300", private: "bg-amber-50 border-amber-400", opinion: "bg-amber-50 border-amber-400", ok: "bg-emerald-50 border-emerald-300" };

    function App() {
      const [topics, setTopics] = useState([]);
      const [topic, setTopic] = useState(null);
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [district, setDistrict] = useState("");
      const [user, setUser] = useState({ applicant_name: "", applicant_address: "", applicant_contact: "" });
      const [draft, setDraft] = useState("");
      const [q, setQ] = useState("");
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        fetch(API + "/rti/topics").then(r => r.json()).then(setTopics)
          .catch(() => setErr("Could not reach the RTI server. Check that it is running."));
      }, []);

      const load = (t, d) => {
        setTopic(t); setErr(null); setData(null);
        let url = API + "/politicians/" + encodeURIComponent(ID) + "/rti/" + t;
        if (d) url += "?district=" + encodeURIComponent(d);
        fetch(url)
          .then(async r => { if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || "Request failed"); } return r.json(); })
          .then(setData).catch(e => setErr(e.message));
      };

      useEffect(() => {
        if (!data || !data.template) return;
        let t = data.template.text;
        data.template.user_fields.forEach(f => { if (user[f]) t = t.split("{" + f + "}").join(user[f]); });
        setDraft(t);
      }, [data, user]);

      const download = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([draft], { type: "text/plain;charset=utf-8" }));
        a.download = "RTI_application.txt"; a.click();
      };
      const copy = () => navigator.clipboard.writeText(draft).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); });
      const addQuestion = () => {
        const n = (draft.match(/^\d+\. /gm) || []).length + 1;
        setDraft(draft.replace(/\n\nI am paying/, "\n" + n + ". " + q.trim() + "\n\nI am paying"));
        setQ("");
      };

      const verdict = checkQuestion(q);
      const input = "w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800";

      if (!ID) return <p className="max-w-xl mx-auto mt-16 text-center">Open this page from a politician's profile, so the address ends with ?id=their-id.</p>;

      return (
        <div className="max-w-6xl mx-auto">
          <h1 className="text-2xl font-semibold mb-1">File an RTI</h1>
          <p className="text-sm text-slate-600 mb-4">{data ? data.politician.name : "Choose a topic to prepare your application."}</p>

          <div className="flex flex-wrap gap-2 mb-4">
            {topics.map(t => (
              <button key={t.topic_id} onClick={() => load(t.topic_id, district)}
                className={"rounded-full border px-4 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 " + (topic === t.topic_id ? "bg-blue-900 text-white border-blue-900" : "bg-white border-slate-300 hover:bg-slate-50")}>
                {t.label}
              </button>
            ))}
          </div>
          {err && <p className="mb-4 rounded-md border border-red-300 bg-red-50 p-3 text-sm">{err}</p>}

          <div className="grid gap-4 md:grid-cols-[17rem_1fr_13rem]">
            <aside className="order-2 md:order-1 space-y-3">
              <p className="text-sm font-semibold">Suggestions are guidance, not legal advice.</p>
              <label className="block text-sm">Check a question before you add it
                <textarea rows="4" value={q} onChange={e => setQ(e.target.value)} className={input + " mt-1"} placeholder="Type the question you want to ask" />
              </label>
              {verdict && <div className={"rounded-md border p-3 text-sm " + tone[verdict.kind]}>{verdict.text}</div>}
              {verdict && verdict.kind === "ok" && draft && <button onClick={addQuestion} className="text-sm underline">Add this question to the draft</button>}
            </aside>

            <main className="order-1 md:order-2 space-y-3">
              {data && data.missing_fields.includes("district") && (
                <div className="rounded-md border border-amber-400 bg-amber-50 p-3 text-sm flex gap-2 items-end">
                  <label className="flex-1">Enter the district, which is needed to find the right authority
                    <input value={district} onChange={e => setDistrict(e.target.value)} className={input + " mt-1"} />
                  </label>
                  <button onClick={() => load(topic, district)} className="rounded-md bg-blue-900 text-white px-3 py-2 text-sm">Update draft</button>
                </div>
              )}
              {data && data.template && (<>
                <div className="grid gap-2 sm:grid-cols-3">
                  {[["applicant_name", "Your name"], ["applicant_address", "Your postal address"], ["applicant_contact", "Phone or email"]].map(([k, label]) => (
                    <label key={k} className="text-sm">{label}
                      <input value={user[k]} onChange={e => setUser({ ...user, [k]: e.target.value })} className={input + " mt-1"} />
                    </label>
                  ))}
                </div>
                <p className="text-xs text-slate-600">Your details stay in this browser and are never sent anywhere. Fill them in first, then edit the letter.</p>
                <textarea value={draft} onChange={e => setDraft(e.target.value)} rows="26"
                  className="letter w-full rounded-md border border-slate-300 bg-white p-6 shadow-sm text-[15px] focus:outline-none focus:ring-2 focus:ring-blue-800" />
              </>)}
              {data && !data.template && <p className="rounded-md border p-3 text-sm bg-white">{data.notes.join(" ")}</p>}
              {!data && !err && topic && <p className="text-sm">Preparing your draft.</p>}
            </main>

            <aside className="order-3 space-y-3 text-sm">
              {data && data.template && (<>
                <button onClick={download} className="w-full rounded-md bg-blue-900 text-white py-2 font-semibold">Download</button>
                <button onClick={copy} className="w-full rounded-md border border-slate-300 bg-white py-2">{copied ? "Copied" : "Copy text"}</button>
                <div className="rounded-md bg-white border border-slate-300 p-3">
                  <p className="font-semibold">Where to send it</p>
                  <p>{data.authority.name}</p>
                  {data.authority.portal_url && <a className="underline" href={data.authority.portal_url} target="_blank" rel="noreferrer">Online portal</a>}
                  <p className="mt-1">Fee: {data.authority.fee ? "Rs. " + data.authority.fee : "check the local rules"}</p>
                  {!data.authority.verified && <p className="mt-1 text-amber-800">These details are not verified yet. Check the PIO address on the official website.</p>}
                </div>
                <div className="rounded-md bg-white border border-slate-300 p-3">
                  <p className="font-semibold">Dates to remember</p>
                  <p>Reply due by {fmt(data.deadlines.reply_due)}</p>
                  <p>If there is no reply, file the first appeal by {fmt(data.deadlines.first_appeal_by)}</p>
                </div>
                {data.notes.map((n, i) => <p key={i} className="text-xs text-slate-600">{n}</p>)}
              </>)}
            </aside>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
