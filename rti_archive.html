  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const CATEGORIES = [
      { id: "All", label: "All Sectors", count: 50 },
      { id: "Education", label: "Education", count: 13 },
      { id: "Railways", label: "Railways", count: 12 },
      { id: "Home Affairs", label: "Home Affairs", count: 13 },
      { id: "Finance", label: "Finance & Economy", count: 12 }
    ];

    function getRtiBase() {
      if (window.BP_CONFIG && typeof window.BP_CONFIG.rtiBase === "string") {
        return window.BP_CONFIG.rtiBase;
      }
      if (window.location.port === "5500" || window.location.protocol === "file:") {
        return `http://${window.location.hostname || "127.0.0.1"}:8001`;
      }
      return "";
    }

    function getPdfUrl(record) {
      if (record && record.id) {
        return `${getRtiBase()}/rti/documents/${encodeURIComponent(record.id)}/pdf`;
      }
      return (record && record.pdf_url) || "#";
    }

    function getCategoryMonogram(category) {
      const s = String(category || "RTI").trim();
      const parts = s.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return s.slice(0, 2).toUpperCase();
    }

    function App() {
      const [records] = useState(window.__CURATED_RTIS__ || []);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");
      const [activePdfModal, setActivePdfModal] = useState(null);
      const [expandedQuestions, setExpandedQuestions] = useState({});
      const [isDark, setIsDark] = useState(document.documentElement.classList.contains("dark"));

      const toggleTheme = () => {
        const next = !isDark;
        setIsDark(next);
        if (next) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("bp_theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("bp_theme", "light");
        }
      };

      const toggleQuestions = (id) => {
        setExpandedQuestions(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const filteredRecords = useMemo(() => {
        const byMeta = records.filter(r => {
          if (selectedCategory !== "All" && r.category !== selectedCategory) return false;
          if (statusFilter !== "all" && r.response_status !== statusFilter) return false;
          return true;
        });
        const rawQ = searchQuery.trim();
        if (!rawQ) return byMeta;
        const q = rawQ.toLowerCase();
        const extract = (r) => [
          r.title, r.department, r.ministry, r.state, r.subject,
          r.response_summary, ...(r.questions || []), ...(r.tags || [])
        ].filter(Boolean).join(" ");
        if (window.BP_FUZZY && typeof window.BP_FUZZY.filter === "function") {
          return window.BP_FUZZY.filter(byMeta, rawQ, extract, 0.42);
        }
        return byMeta.filter(r => extract(r).toLowerCase().includes(q));
      }, [records, selectedCategory, searchQuery, statusFilter]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") setActivePdfModal(null);
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      return (
        <div className="app-shell">
          <aside className="side-rail" aria-label="Primary Navigation">
            <div className="rail-top">
              <a href="graphdashboard2.html" className="rail-brand" title="Bharat Praman" aria-label="Bharat Praman">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/>
                  <path d="M8.7 10.7l6.6-3.4"/><path d="M8.7 13.3l6.6 3.4"/>
                </svg>
              </a>
              <nav className="rail-nav" aria-label="Primary">
                <a href="graphdashboard2.html" className="rail-btn" data-tip="Search & Audit" aria-label="Search & Audit">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </a>
                <a href="graph.html" className="rail-btn" data-tip="Graph Explorer" aria-label="Graph Explorer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </a>
                <a href="ask.html" className="rail-btn" data-tip="Fiscal Intelligence" aria-label="Fiscal Intelligence">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </a>
                <a href="rti/rti_page.html" className="rail-btn" data-tip="RTI Desk" aria-label="RTI Desk">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </a>
                <a href="rti_archive.html" className="rail-btn active" data-tip="RTI Archive" aria-label="RTI Archive">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                </a>
              </nav>
            </div>
            <div className="rail-bottom">
              <button
                id="themeToggle"
                onClick={toggleTheme}
                className={`rail-theme-capsule ${isDark ? "is-dark" : ""}`}
                type="button"
                role="switch"
                aria-checked={isDark ? "true" : "false"}
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
              >
                <span className="rail-theme-slot rail-theme-moon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
                <span className="rail-theme-slot rail-theme-sun" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </span>
              </button>
              <a href="graph.html#glossary" className="rail-btn" data-tip="Glossary & IPC" aria-label="Glossary & IPC">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              </a>
            </div>
          </aside>

          <div className="app-main-col">
            <header className="page-topbar">
              <div className="page-topbar-left">
                <h1 className="page-topbar-title">RTI Archive</h1>
                <span className="page-topbar-sub">Official RTI Applications &amp; Disclosed Responses ({records.length} Records)</span>
              </div>
              <div className="page-topbar-right">
                <a href="graph.html#glossary" className="top-icon-btn" title="Glossary & IPC Reference" aria-label="Glossary & IPC Reference">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </a>
                <a href="graphdashboard2.html#benchmark" className="top-icon-btn" title="GraphRAG Benchmark" aria-label="GraphRAG Benchmark">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </a>
                <a href="graphdashboard2.html" className="top-profile-pill">
                  <span className="top-profile-avatar">BP</span>
                  <span>Bharat Praman</span>
                </a>
              </div>
            </header>

            <div className="tabs-row">
              <div className="filter-tabs" role="tablist" aria-label="Sector Filter Tabs">
                {CATEGORIES.map(cat => {
                  const countVal = cat.id === "All"
                    ? records.length
                    : records.filter(r => r.category === cat.id).length;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      className={`tab-btn ${selectedCategory === cat.id ? "active" : ""}`}
                      role="tab"
                      aria-selected={selectedCategory === cat.id ? "true" : "false"}
                    >
                      <span>{cat.label}</span>
                      <span className="tab-count">{countVal || cat.count}</span>
                    </button>
                  );
                })}
              </div>
              <div className="tabs-status-toast">
                <span className="toast-dot" aria-hidden="true">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
                <span>Showing {filteredRecords.length} of {records.length} Disclosed RTIs</span>
              </div>
            </div>

            <div className="workspace-sheet">
              <main className="container">
                <div className="stats-row">
                  <div className="stat-card">
                    <div className="stat-label">Curated Documents</div>
                    <div className="stat-val">{records.length} Records</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">PDF Verification</div>
                    <div className="stat-val highlight">100% Accessible</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Strategic Sectors</div>
                    <div className="stat-val">4 Categories</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">Load Latency</div>
                    <div className="stat-val highlight">&lt; 5ms (Instant)</div>
                  </div>
                </div>

                {/* Search & Status Filters */}
                <div className="filter-deck">
                  <div className="search-row">
                    <div className="search-input-wrap">
                      <input
                        type="text"
                        placeholder="Search by keyword, authority, question, or topic..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="search-input"
                      />
                    </div>
                    <select
                      value={statusFilter}
                      onChange={(e) => setStatusFilter(e.target.value)}
                      className="status-select"
                    >
                      <option value="all">All Disclosed Statuses</option>
                      <option value="full_response">Full Response</option>
                      <option value="partial_response">Partial Response</option>
                    </select>
                  </div>
                </div>

                {/* Documents Grid */}
                {filteredRecords.length === 0 ? (
                  <div style={{ textAlign: "center", padding: "56px 20px", background: "var(--surface)", borderRadius: "var(--card-radius)", border: "1px solid var(--border)" }}>
                    <h3 style={{ fontSize: "19px", fontWeight: 700, margin: "0 0 8px 0" }}>No matching RTI documents found</h3>
                    <p style={{ color: "var(--muted)", fontSize: "13px", margin: "0 0 16px 0" }}>Try adjusting your search terms or clearing filters.</p>
                    <button
                      onClick={() => { setSearchQuery(""); setSelectedCategory("All"); setStatusFilter("all"); }}
                      className="btn-primary"
                    >
                      Reset All Filters
                    </button>
                  </div>
                ) : (
                  <div className="docs-grid">
                    {filteredRecords.map(r => {
                      const pdfLink = getPdfUrl(r);
                      const isExpanded = expandedQuestions[r.id];
                      const qCount = (r.questions || []).length;
                      const authorityName = r.department || r.ministry || r.state || "Central Public Authority";

                      return (
                        <article key={r.id} className="doc-card">
                          <div>
                            <div className="card-top">
                              <div className="card-source-brand">
                                <span className="card-emblem">{getCategoryMonogram(r.category)}</span>
                                <span className="cat-pill">{r.category}</span>
                              </div>
                              <span className={`status-pill ${r.response_status === "full_response" ? "full" : ""}`}>
                                {r.response_status ? r.response_status.replace("_", " ") : "disposed"}
                              </span>
                            </div>

                            <div className="card-meta-boxes">
                              <div className="meta-box">
                                <div className="meta-box-label">
                                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></svg>
                                  <span>Authority</span>
                                </div>
                                <div className="meta-box-val" title={authorityName}>{authorityName}</div>
                              </div>
                              <div className="meta-box">
                                <div className="meta-box-label">
                                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                  <span>Filing Date</span>
                                </div>
                                <div className="meta-box-val">{r.date_filed ? r.date_filed : "Disclosed"}</div>
                              </div>
                            </div>

                            <h2 className="card-title">{r.title}</h2>

                            {r.subject && (
                              <div className="card-subject">
                                <strong>Subject:</strong> {r.subject}
                              </div>
                            )}

                            {r.questions && r.questions.length > 0 && (
                              <div className="q-block">
                                <div className="q-head">
                                  <span>Questions Sought ({qCount}):</span>
                                  {qCount > 1 && (
                                    <button onClick={() => toggleQuestions(r.id)} className="q-toggle">
                                      {isExpanded ? "Collapse" : `View All (${qCount})`}
                                    </button>
                                  )}
                                </div>
                                <ul className="q-list">
                                  {(isExpanded ? r.questions : r.questions.slice(0, 1)).map((q, idx) => (
                                    <li key={idx} className="q-item">
                                      <strong style={{ color: "var(--accent)", marginRight: "6px" }}>{idx + 1}.</strong>
                                      {q}
                                    </li>
                                  ))}
                                </ul>
                              </div>
                            )}

                            {r.response_summary && (
                              <div className="resp-box">
                                <div className="resp-label">Official Disclosed Reply Excerpt:</div>
                                <div>{r.response_summary}</div>
                              </div>
                            )}
                          </div>

                          <div className="card-actions">
                            <span className="card-id">ID: {r.id.slice(0, 8)}</span>
                            <div className="btn-group">
                              <button onClick={() => setActivePdfModal(r)} className="btn-primary">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                <span>View PDF</span>
                              </button>
                              <a href={pdfLink} target="_blank" rel="noopener noreferrer" className="btn-secondary" title="Open in new tab">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                              </a>
                              <a href={pdfLink} download={`${r.id}.pdf`} className="btn-secondary" title="Download PDF">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                              </a>
                            </div>
                          </div>
                        </article>
                      );
                    })}
                  </div>
                )}

                <footer className="footer">
                  <div className="footer-inner">
                    <div>
                      <strong>Bharat Praman</strong> // Section 6(1) Right to Information Suite
                    </div>
                    <div style={{ display: "flex", gap: "16px" }}>
                      <a href="graphdashboard2.html">Search</a>
                      <a href="graph.html#glossary">Glossary &amp; IPC</a>
                      <a href="ask.html">Budget Dossier</a>
                      <a href="rti/rti_page.html">RTI Desk</a>
                    </div>
                  </div>
                </footer>
              </main>
            </div>
          </div>

          {/* Modal PDF Viewer */}
          {activePdfModal && (
            <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) setActivePdfModal(null); }}>
              <div className="modal-window">
                <div className="modal-header">
                  <div style={{ minWidth: 0, flex: "1 1 240px" }}>
                    <div style={{ fontSize: "11px", fontWeight: "700", color: "var(--accent)", textTransform: "uppercase" }}>
                      Official RTI Document // {activePdfModal.category}
                    </div>
                    <h3 className="modal-title">{activePdfModal.title}</h3>
                  </div>
                  <div style={{ display: "flex", gap: "8px", flexShrink: 0 }}>
                    <a
                      href={getPdfUrl(activePdfModal)}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="btn-secondary"
                    >
                      Open in Tab
                    </a>
                    <a
                      href={getPdfUrl(activePdfModal)}
                      download={`${activePdfModal.id}.pdf`}
                      className="btn-primary"
                    >
                      Download PDF
                    </a>
                    <button onClick={() => setActivePdfModal(null)} className="btn-secondary">
                      Close
                    </button>
                  </div>
                </div>
                <div className="modal-body">
                  <iframe
                    src={getPdfUrl(activePdfModal)}
                    title={activePdfModal.title}
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
