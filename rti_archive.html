nes"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870865158-1669_2014_LS_1_1554__2014_2601_Apn_Rply.pdf", "local_pdf_path": "pdfs/6a6b9313-f91d-4ff1-a4b3-5d90d01af0f6.pdf", "has_pdf": true, "original_filename": "1669_2014_LS_1_1554__2014_2601_Apn_Rply.pdf"}, {"id": "f31e07ca-2fab-4450-94ff-48877711c89b", "category": "Education", "title": "RTI on Religion and Qualifications of Rahul Gandhi and Sonia Gandhi", "department": "Who's Who Cell (LARRDIS)", "ministry": "Lok Sabha Secretariat", "state": "Central Government", "date_filed": "2015-09-15", "date_of_response": "2015-10-07", "response_status": "partial_response", "subject": "RTI seeking information on the religion, correct name and educational qualifications of MPs Rahul Gandhi and Sonia Gandhi.", "questions": ["Kindly let me know the Religion and Correct Name of Sh. Rahul Gandhi, Member of Parliament from Amethi and Vice-Chairman of Indian National Congress and Smt. Sonia Gandhi, Chairperson of the United Progressive Alliance.", "Kindly let me know their qualifications too."], "response_summary": "The Secretariat stated that name and qualification details of Rahul Gandhi and Sonia Gandhi are available in their bio-profiles on the Lok Sabha website, and that the Who's Who Cell does not maintain information on Members' religion, caste or creed.", "tags": ["Rahul Gandhi", "Sonia Gandhi", "religion", "qualifications", "Who's Who Cell"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870811842-1599_2015_LS_1_1443__2015_4556_Apn_Rply.pdf", "local_pdf_path": "pdfs/f31e07ca-2fab-4450-94ff-48877711c89b.pdf", "has_pdf": true, "original_filename": "1599_2015_LS_1_1443__2015_4556_Apn_Rply.pdf"}, {"id": "58596acb-a1fe-4d14-9d2a-e6d567f105a7", "category": "Education", "title": "Educational qualification statistics of Lok Sabha MPs sought", "department": "सूचना प्रकोष्ठ / Information Cell, Lok Sabha Secretariat (Who's Who Cell)", "ministry": null, "state": "Central Government", "date_filed": "2017-09-25", "date_of_response": "2017-10-10", "response_status": "full_response", "subject": "Applicant sought the number of MPs who are graduates versus those educated only up to 10th/12th standard.", "questions": ["Provide No. of Member of Parliament are graduate/Degree from recognized University and No. of Member Educational status is up to 10th Standard/12th standard."], "response_summary": "The Secretariat referred the applicant to the Lok Sabha website's member bio-profiles and the 'Qualification wise' member search feature for educational qualification details of 16th Lok Sabha MPs.", "tags": ["MP educational qualification", "Who's Who Cell", "16th Lok Sabha", "bio-profile"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870781687-1521_2017_LS_1_1393__2017_9144_Apn_Rply.pdf", "local_pdf_path": "pdfs/58596acb-a1fe-4d14-9d2a-e6d567f105a7.pdf", "has_pdf": true, "original_filename": "1521_2017_LS_1_1393__2017_9144_Apn_Rply.pdf"}, {"id": "b063456e-8ae5-4ea3-acc5-0acd1f19f167", "category": "Railways", "title": "Clarification on PAC report sought, transferred to Railways", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-28", "date_of_response": "2017-01-11", "response_status": "no_response", "subject": "RTI seeking clarification regarding a Public Accounts Committee (PAC) report.", "questions": ["Clarification regarding PAC report"], "response_summary": "The Secretariat informed the applicant that the information sought did not pertain to this Secretariat's Public Accounts Committee branch and that the application was also transferred to the Ministry of Railways on 03.01.2017.", "tags": ["PAC report", "Public Accounts Committee", "RTI transfer", "Ministry of Railways"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949158766-2419_2016_LS_1_2229__2016_7608_Apn_Rply.pdf", "local_pdf_path": "pdfs/b063456e-8ae5-4ea3-acc5-0acd1f19f167.pdf", "has_pdf": true, "original_filename": "2419_2016_LS_1_2229__2016_7608_Apn_Rply.pdf"}, {"id": "77d2ad60-4086-4eec-85db-1d23d2b8ef7c", "category": "Railways", "title": "RTI on Internship and Practical Parliamentary Experience Programmes", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-11-15", "date_of_response": "2017-01-05", "response_status": "full_response", "subject": "The RTI sought information on programmes providing citizens practical experience of Parliamentary working, including internships with Members and Committees.", "questions": ["Provisions made to give practical experience of Parliamentary working to citizens of country.", "Information regarding internship or any other kind of short time working available to work with Members of both the Houses or their offices or into the office of any House.", "Information about any Committee, Intern, etc. under the House to attain practical experience."], "response_summary": "The Secretariat detailed that the Bureau of Parliamentary Studies and Training (BPST) organizes training programmes, study visits, and one-month and three-month internship programmes (25 interns each) for students, including attachment with Parliamentary Committees, though Committee meetings remain in camera and accessible only to Secretariat staff and invited officials.", "tags": ["Bureau of Parliamentary Studies and Training", "internship programme", "Parliamentary Committees", "citizen participation"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948948118-2130_2016_LS_1_1959__2016_7319_Apn_Rply.pdf", "local_pdf_path": "pdfs/77d2ad60-4086-4eec-85db-1d23d2b8ef7c.pdf", "has_pdf": true, "original_filename": "2130_2016_LS_1_1959__2016_7319_Apn_Rply.pdf"}, {"id": "07660b96-4d88-4474-8fea-1ca5716c28a1", "category": "Railways", "title": "Contact Details of Lok Sabha Offices and Members of Parliament", "department": "Information Cell, Lok Sabha Secretariat", "ministry": "Department of Personnel & Training", "state": "Central Government", "date_filed": "2016-10-26", "date_of_response": "2016-11-23", "response_status": "full_response", "subject": "The applicant sought telephone numbers, email addresses and postal addresses of all Lok Sabha Secretariat offices/sections and of all Members of Parliament.", "questions": ["Telephone number and email address alongwith postal address of all offices, section, units and divisions", "Telephone number and email address alongwith postal address of all MPs"], "response_summary": "The Secretariat directed the applicant to the Lok Sabha website and internal telephone directory for office contact details, and to the Members' section of the website for MPs' contact information, also noting the printed list of Members is available for sale.", "tags": ["contact directory", "Members of Parliament", "Lok Sabha website", "Information Cell"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948911585-2058_2016_LS_1_1893__2016_7247_Apn_Rply.pdf", "local_pdf_path": "pdfs/07660b96-4d88-4474-8fea-1ca5716c28a1.pdf", "has_pdf": true, "original_filename": "2058_2016_LS_1_1893__2016_7247_Apn_Rply.pdf"}, {"id": "556d65b1-d618-4a26-87a5-da19a4ed8aa6", "category": "Railways", "title": "Number of Ex-MPs Receiving Monthly Pension and Related Perks", "department": "Members Salary and Allowances (MSA) Branch, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-10-22", "date_of_response": "2016-11-22", "response_status": "partial_response", "subject": "The applicant sought data on the number of former Lok Sabha MPs receiving monthly pension, the pension rate, and other perks/facilities available to ex-MPs.", "questions": ["How many former MP, Lok Sabha are in receipt of monthly pension from govt. exchequer.", "What is rate of such monthly pension", "How many of those former MPs who are in receipt of monthly pension.", "Perks/facilities provided to Ex-MPs other than Pension."], "response_summary": "The Secretariat stated that consolidated data as sought is not maintained, but a register with about 375 pages listing MPs whose pension has been processed is available for inspection; it explained the pension rate formula, and listed perks such as free rail travel and access to Parliament House Complex, while also noting the matter was transferred to CPAO and to the Ministry of Railways.", "tags": ["Ex-MP pension", "MSA Branch", "CPAO", "MP perks and facilities", "Ministry of Railways"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948909776-2057_2016_LS_1_1892__2016_7246_Apn_Rply.pdf", "local_pdf_path": "pdfs/556d65b1-d618-4a26-87a5-da19a4ed8aa6.pdf", "has_pdf": true, "original_filename": "2057_2016_LS_1_1892__2016_7246_Apn_Rply.pdf"}, {"id": "00f818d1-343a-4825-a0f5-34dea4f2aa44", "category": "Railways", "title": "Parliament canteen food subsidy rules and rate list", "department": "सूचना प्रकोष्ठ / Information Cell, Lok Sabha Secretariat", "ministry": "Ministry of Parliamentary Affairs (transferring ministry)", "state": "Central Government", "date_filed": "2014-11-08", "date_of_response": "2014-12-24", "response_status": "full_response", "subject": "Applicant, via transfer from the Ministry of Parliamentary Affairs, sought the rules, rate list, contract and subsidy details of food provided in Parliament House canteens.", "questions": ["Rules and Regulations under which the food is being provided to the Members of Parliament at subsidized rates and the minutes of the meeting in which such rules and regulations have been framed.", "Complete Rate list of the food which is being provided at the subsidized rates in the canteen of the Parliament.", "Copy of the contract which is entered into between the Parliament and the present canteen owner.", "Total amount of subsidy which have been given by the Central Government of India on the food being provided in the Parliament in the year 2009, 2010, 2011, 2012 and 2013.", "Inspection of the canteen premises of the Parliament."], "response_summary": "The Secretariat explained that food rates are fixed by the Joint Parliamentary Committee on Food Management, enclosed the menu/rate list and subsidy expenditure figures for 2009-10 to 2012-13, clarified that Northern Railway runs the canteens on a no-profit-no-loss basis with no separate contract, and noted that premises are jointly inspected by the Committee, Northern Railway and the Secretariat.", "tags": ["Parliament canteen", "food subsidy", "Northern Railway catering", "Joint Parliamentary Committee"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948773646-1789_2014_LS_1_1664__2014_2721_Apn_Rply_1_.pdf", "local_pdf_path": "pdfs/00f818d1-343a-4825-a0f5-34dea4f2aa44.pdf", "has_pdf": true, "original_filename": "1789_2014_LS_1_1664__2014_2721_Apn_Rply_1_.pdf"}, {"id": "7afc156d-e62c-4bb0-a7ae-57af76f08bd3", "category": "Railways", "title": "RTI on Parliament canteen food subsidy and rate list", "department": "Lok Sabha Secretariat, Information Cell", "ministry": null, "state": "Central Government", "date_filed": "2014-11-08", "date_of_response": "2014-12-24", "response_status": "full_response", "subject": "The applicant sought details of the rules, rate list, contract and subsidy amount related to subsidized food served in Parliament canteens.", "questions": ["Rules and Regulations under which the food is being provided to the Members of Parliament at subsidized rates and the minutes of the meeting in which such rules and regulations have been framed.", "Complete Rate list of the food which is being provided at the subsidized rates in the canteen of the Parliament.", "Copy of the contract which is entered into between the Parliament and the present canteen owner.", "Total amount of subsidy which have been given by the Central Government of India on the food being provided in the Parliament in the year 2009, 2010, 2011, 2012 and 2013.", "Inspection of the canteen premises of the Parliament."], "response_summary": "Lok Sabha Secretariat stated that canteen food rates are fixed by the Joint Parliamentary Committee on Food Management and are served by Northern Railway on a no-profit-no-loss basis, with no contract executed. Rate lists and subsidy figures for 2009-13 were enclosed as annexures, and inspection is carried out jointly by the Committee, Northern Railway and the Secretariat.", "tags": ["Parliament canteen", "food subsidy", "Northern Railway", "RTI Act 2005", "Lok Sabha Secretariat"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948772212-1789_2014_LS_1_1664__2014_2721_Apn_Rply.pdf", "local_pdf_path": "pdfs/7afc156d-e62c-4bb0-a7ae-57af76f08bd3.pdf", "has_pdf": true, "original_filename": "1789_2014_LS_1_1664__2014_2721_Apn_Rply.pdf"}, {"id": "60867d6e-7903-499a-be4c-d9a782d1c03e", "category": "Railways", "title": "RTI on MP's Parliament questions and fake caste certificate appointments", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat / G&D Section (LARRDIS)", "ministry": null, "state": "Central Government", "date_filed": "2017-10-23", "date_of_response": "2017-11-07", "response_status": "partial_response", "subject": "Applicant sought copies of a reply/question raised by MP Dr. Jitendra Singh, the status of action on certain fake appointments, and figures on people working using fake caste certificates.", "questions": ["Reply given by Dr. Jitendra Singh [MP] and copy of that Question [raised in Parliament].", "What has been done or is underway on these fake appointments", "Correct figures, how many people are working illegally by fake caste certificates"], "response_summary": "The Secretariat informed the applicant that questions raised/debate participation by Dr. Jitendra Singh, MP, is available on his Member Homepage on the Lok Sabha website, and that the query on fake appointments was transferred online to the Department of Personnel & Training. Note: this scanned file also contains a misfiled page that is an exact duplicate of a separate RTI reply letter (file 1(1569)/IC/17) addressed to a different, unrelated applicant; that content does not pertain to this RTI and has been redacted here as it contains another citizen's personal details.", "tags": ["MP Parliament questions", "fake caste certificates", "Department of Personnel and Training", "Jitendra Singh MP"], "language": "mixed", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948735264-1692_2017_LS_1_1557__2017_9315_Apn_Rply.pdf", "local_pdf_path": "pdfs/60867d6e-7903-499a-be4c-d9a782d1c03e.pdf", "has_pdf": true, "original_filename": "1692_2017_LS_1_1557__2017_9315_Apn_Rply.pdf"}, {"id": "d1ea5e1e-783f-4ba7-8b4f-1eb8b8ed15bd", "category": "Railways", "title": "RTI on Subsidy and Annual Government Expenses on MPs", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-08-29", "date_of_response": "2016-08-31", "response_status": "full_response", "subject": "RTI seeking information on subsidy given to MPs for day-to-day life and annual government expenses on MPs.", "questions": ["How much subsidy given to MPs on his day to day life and annual expenses made by the Government on MPs."], "response_summary": "It was clarified that Members are not given a daily subsidy but are paid salary and allowances; there is no canteen subsidy for Members as the Parliament House Complex canteen is run by Northern Railways on a payment basis. Salaries and allowances of MPs are governed by specific listed Acts and Rules available on the Lok Sabha website.", "tags": ["MP subsidy", "salary and allowances", "Parliament House canteen", "Northern Railways"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870856371-1655_2016_LS_1_1522__2016_6844_Apn_Rply.pdf", "local_pdf_path": "pdfs/d1ea5e1e-783f-4ba7-8b4f-1eb8b8ed15bd.pdf", "has_pdf": true, "original_filename": "1655_2016_LS_1_1522__2016_6844_Apn_Rply.pdf"}, {"id": "5d87e415-546c-4de5-8ad6-7e38e0cbb912", "category": "Railways", "title": "Internal status sheet: grievance against SSC transferred to DoPT", "department": "Information Cell", "ministry": "Lok Sabha Secretariat", "state": "Central Government", "date_filed": "2014-09-16", "date_of_response": null, "response_status": "no_response", "subject": "This is an internal RTI-tracking status sheet noting that the applicant's grievance about non-appointment as Constable (Gd.) 2011 through a Staff Selection Commission exam did not pertain to Lok Sabha Secretariat and was transferred online to the Department of Personnel & Training.", "questions": ["Does not seek information from this Secretariat but redress his grievance against Staff Selection Commission regarding his non-appointment through exam for constable Gd. 2011"], "response_summary": "The internal remarks note that the point raised does not pertain to Lok Sabha Secretariat but relates to the Department of Personnel & Training, and that a copy of the application was transferred to the concerned Ministry online.", "tags": ["Staff Selection Commission grievance", "Constable exam 2011", "Department of Personnel and Training", "application transfer"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870752736-1485_2014_LS_1_1384__2014_2417_Apn_Rply.pdf", "local_pdf_path": "pdfs/5d87e415-546c-4de5-8ad6-7e38e0cbb912.pdf", "has_pdf": true, "original_filename": "1485_2014_LS_1_1384__2014_2417_Apn_Rply.pdf"}, {"id": "48b91c87-f01c-481b-a0de-a51386a10270", "category": "Railways", "title": "RTI on MP Canteen Subsidy and Taxability of MP Salary", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-07-13", "date_of_response": "2016-07-21", "response_status": "partial_response", "subject": "RTI seeking information on subsidised canteen facilities availed by MPs in Parliament and the taxability of MP salary.", "questions": ["Are the MPs taking benefit of subsidized canteen in the Parliament", "Salary of the member of the Parliament is considered taxable."], "response_summary": "The Secretariat stated that MPs avail food facilities in the Parliament House Complex canteen run by Northern Railway on a 'no profit no loss' basis, and that MP salary and allowances are taxed under 'Income from other sources', not subject to TDS, with Members required to discharge tax liability via advance tax or self-assessment tax; a copy of the relevant Bulletin was enclosed.", "tags": ["MP canteen subsidy", "MP salary taxation", "Northern Railway catering", "RTI Act 2005"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870673262-1400_2016_LS_1_1294__2016_6589_Apn_Rply.pdf", "local_pdf_path": "pdfs/48b91c87-f01c-481b-a0de-a51386a10270.pdf", "has_pdf": true, "original_filename": "1400_2016_LS_1_1294__2016_6589_Apn_Rply.pdf"}, {"id": "19769e6b-a6df-4219-ade9-7dfcad1a0424", "category": "Railways", "title": "RTI on Parliament House Canteen Rates Before and After GST", "department": "General Works Branch, Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2017-08-28", "date_of_response": "2017-09-22", "response_status": "full_response", "subject": "Applicant sought the tax rate implemented on the Parliament House canteen before GST and invoice/rate details before and after GST implementation.", "questions": ["Information regarding provide the copy of tax rate implemented on Parliament Canteen before GST.", "After GST and copy of invoice made as per supply before and after implementation GST."], "response_summary": "The Secretariat, based on information from the OSD (Catering), Northern Railway Catering Unit, enclosed the rate list of items (inclusive of VAT) served in the Parliament House Catering Complex before GST, and separately enclosed the list of rates before and after GST implementation, since the term 'invoice' in the second query was unclear.", "tags": ["RTI", "Parliament canteen rates", "GST", "catering rates", "Northern Railway catering"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870621881-1325_2017_LS_1_1206__2017_8948_Apn_Rply.pdf", "local_pdf_path": "pdfs/19769e6b-a6df-4219-ade9-7dfcad1a0424.pdf", "has_pdf": true, "original_filename": "1325_2017_LS_1_1206__2017_8948_Apn_Rply.pdf"}, {"id": "b238ba67-0ca3-47a1-84c3-3ab4ff9ff99a", "category": "Railways", "title": "RTI on MPs salary, allowances and travel expenditure details", "department": "Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2017-08-16", "date_of_response": "2017-09-19", "response_status": "partial_response", "subject": "Applicant sought information on the salary, allowances, and bus/rail/air fare expenditure of Members of Parliament, including international travel expenses since May 2016.", "questions": ["Information regarding Salary, Allowance and Bus, Rail, air fare provided to the MPs(Lok Sabha)", "From May 2016 till now expenditure of MPs on Bus, Rail and Domestic Air travel.", "The amount sought by MPs to incur expenditure on international visits since May, 2016.", "How much amount per month is earmarked for Bus, Rail and Air Journey by Member of Parliament.", "Name the members who have never taken any type of Travel allowance since May 2016."], "response_summary": "The Secretariat listed the Acts/Rules governing MP salaries and allowances, stated that detailed expenditure data on bus/rail/air travel is voluminous and can be inspected at the branch, that international travel tickets are booked via Air India/Balmer Lawrie with aggregate figures on the Lok Sabha website, and that data on members never claiming travel allowance is not maintained.", "tags": ["MP allowances", "travel expenditure", "Conference Branch", "MSA Branch", "Parliament Members"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788870545420-1249_2017_LS_1_1137__2017_8872_Apn_Rply.pdf", "local_pdf_path": "pdfs/b238ba67-0ca3-47a1-84c3-3ab4ff9ff99a.pdf", "has_pdf": true, "original_filename": "1249_2017_LS_1_1137__2017_8872_Apn_Rply.pdf"}, {"id": "9b9ba57b-7e3b-46f0-b928-5a08c7516eb0", "category": "Home Affairs", "title": "Query on MPs' children in armed forces and Group A posts", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-30", "date_of_response": "2017-01-18", "response_status": "partial_response", "subject": "RTI seeking data on Lok Sabha MPs whose children serve in the armed forces, CAPF, or as Group 'A' officers under the Union Government.", "questions": ["How many of our elected MPs (from the 16th Lok Sabha) have their sons/daughters in the Indian Armed forces/ parliamentary/ CAPF and also how many of the current Lok Sabha Members have their sons/daughters working under the Union Government as Group 'A' Officers.", "Details of MPs sons/daughters working under Union Government as Group 'A' Officers."], "response_summary": "The Who's Who Cell stated that such information is not sought from Members and hence not available with it; the query on MPs' children working as Group 'A' officers under the Union Government was transferred online to the Department of Personnel and Training (DoPT).", "tags": ["MPs family members", "Armed forces", "Group A officers", "DoPT transfer", "Who's Who Cell"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949171289-2432_2016_LS_1_2241__2016_7621_Apn_Rply.pdf", "local_pdf_path": "pdfs/9b9ba57b-7e3b-46f0-b928-5a08c7516eb0.pdf", "has_pdf": true, "original_filename": "2432_2016_LS_1_2241__2016_7621_Apn_Rply.pdf"}, {"id": "ae0b7fa7-269e-49ca-a514-6480e97af430", "category": "Home Affairs", "title": "Status of Own Job Application for Security Assistant Post Sought", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-12", "date_of_response": "2016-12-22", "response_status": "full_response", "subject": "RTI seeking status of the applicant's own earlier applications regarding submission of requisite documents for the post of Security Assistant Grade-II (ex-servicemen quota) in Lok Sabha Secretariat.", "questions": ["Please provide me information regarding status of my application dated 08.02.2016 & 16.02.2016 regarding submission of requisite documents for post of Security Assistant Grade-II in Lok Sabha Secretariat."], "response_summary": "The Secretariat informed the applicant that, per his own application particulars for the ex-servicemen-quota post of Security Assistant Grade-II (Technical), he had been working/holding a regular post in the Delhi Metro Rail Corporation (DMRC) since 17.01.2014 and had consequently ceased to enjoy ex-servicemen status, citing the relevant DoPT Office Memorandum dated 14 August 2014.", "tags": ["RTI Act 2005", "recruitment", "Security Assistant", "ex-servicemen status", "Lok Sabha Secretariat"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949049431-2297_2016_LS_1_2116__2016_7486_Apn_Rply.pdf", "local_pdf_path": "pdfs/ae0b7fa7-269e-49ca-a514-6480e97af430.pdf", "has_pdf": true, "original_filename": "2297_2016_LS_1_2116__2016_7486_Apn_Rply.pdf"}, {"id": "e3afa2cd-7af7-462e-9203-6baf418709eb", "category": "Home Affairs", "title": "Governor's Reports on President's Rule in MP and Rajasthan Sought", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": "Ministry of Home Affairs (transferred from)", "state": "Central Government", "date_filed": "2016-05-18", "date_of_response": "2016-12-30", "response_status": "full_response", "subject": "RTI seeking copies of the Governor's Report regarding imposition of President's Rule in Madhya Pradesh and Rajasthan in 1992, transferred from the Ministry of Home Affairs.", "questions": ["Copies of Governor's Report with respect to imposition of President's Rule in the States of Madhya Pradesh & Rajasthan in the year 1992."], "response_summary": "The applicant was informed that the Governor's Report is available in the Parliament Library Section and was advised to visit in person or depute someone to access and obtain a photocopy at Rs. 1 per page, with the Library's Additional Director available to assist.", "tags": ["RTI Act 2005", "Governor's Report", "President's Rule", "Madhya Pradesh", "Rajasthan", "Parliament Library"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949037880-2282_2016_LS_1_2101__2016_7471_Apn_Rply.pdf", "local_pdf_path": "pdfs/e3afa2cd-7af7-462e-9203-6baf418709eb.pdf", "has_pdf": true, "original_filename": "2282_2016_LS_1_2101__2016_7471_Apn_Rply.pdf"}, {"id": "a1611018-88f9-4ff6-a85e-815a28714463", "category": "Home Affairs", "title": "CCTV footage information request denied citing security exemption", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-10-27", "date_of_response": "2016-12-12", "response_status": "full_response", "subject": "The applicant, whose application was transferred from the Rajya Sabha Secretariat, sought CCTV footage-related information and other details, which were denied citing the security-exemption provision of the RTI Act.", "questions": ["सीसीटीवी फुटेज संबंधी जानकारी और अन्य संबंधित ब्यौरे (मूल आवेदन के क्रम सं. 3, 13, 14 और 27)"], "response_summary": "The CPIO stated that the CCTV system is used only for security purposes, and hence information related to CCTV footage does not fall within the scope of disclosure under Section 8(1)(g) of the RTI Act, 2005.", "tags": ["RTI", "CCTV footage", "security exemption", "Section 8(1)(g)", "Lok Sabha Secretariat", "Rajya Sabha Secretariat transfer"], "language": "hindi", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949010591-2215_2016_LS_1_2038__2016_7404_Apn_Rply.pdf", "local_pdf_path": "pdfs/a1611018-88f9-4ff6-a85e-815a28714463.pdf", "has_pdf": true, "original_filename": "2215_2016_LS_1_2038__2016_7404_Apn_Rply.pdf"}, {"id": "47435948-6c5a-4ba8-81c3-617beda97a24", "category": "Home Affairs", "title": "FIRs Registered With Police by Lok Sabha From 2000 to 2015", "department": "Security/Vigilance Branch, Lok Sabha Secretariat", "ministry": "Ministry of Home Affairs", "state": "Central Government", "date_filed": "2016-10-29", "date_of_response": "2016-11-21", "response_status": "full_response", "subject": "The applicant sought the number of FIRs registered with police by Lok Sabha from 2000 to 2015.", "questions": ["How many FIR has been registered with the police by Lok Sabha From 2000 to 2015."], "response_summary": "The Secretariat stated that as per available records, one FIR (No.14 of 2009) was filed with Shri P.D.T. Achary, then Secretary-General of Lok Sabha, as complainant, arising from a Parliamentary Committee's inquiry report on an alleged cash-for-votes matter, which was subsequently referred to the Ministry of Home Affairs by the then Speaker.", "tags": ["FIR Lok Sabha", "cash for votes case", "P.D.T. Achary", "Ministry of Home Affairs", "Parliamentary Committee inquiry"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948919985-2074_2016_LS_1_1906__2016_7263_Apn_Rply.pdf", "local_pdf_path": "pdfs/47435948-6c5a-4ba8-81c3-617beda97a24.pdf", "has_pdf": true, "original_filename": "2074_2016_LS_1_1906__2016_7263_Apn_Rply.pdf"}, {"id": "f19e4b75-b102-4be8-8c56-26cd01351e83", "category": "Home Affairs", "title": "संविधान संशोधनों की संख्या और आपातकाल संबंधी जानकारी", "department": "सूचना प्रकोष्ठ, लोक सभा सचिवालय", "ministry": "गृह मंत्रालय एवं विधि और न्याय मंत्रालय", "state": "Central Government", "date_filed": "2016-10-24", "date_of_response": "2016-11-01", "response_status": "partial_response", "subject": "आवेदक ने भारत में आपातकाल के दौरान किए गए संविधान संशोधनों की संख्या, नाम और संबंधित नियम/प्रक्रिया के बारे में जानकारी मांगी।", "questions": ["कृपया भारत में आपातकाल के दौरान किए गए संविधान संशोधनों की संख्या और नाम बताएं। साथ ही उस नियम/प्रक्रिया के बारे में भी जानकारी दें जिसके तहत यह संशोधन किए गए।"], "response_summary": "सचिवालय ने बताया कि अनुच्छेद 352 के तहत आपातकाल की उद्घोषणा तीन बार जारी की गई और उन अवधियों के दौरान संविधान में 27 बार संशोधन किया गया, जिसकी सूची दी गई। विषयवस्तु लोक सभा सचिवालय से संबंधित न होने के कारण गृह मंत्रालय एवं विधि और न्याय मंत्रालय को अंतरित कर दिया गया।", "tags": ["संविधान संशोधन", "आपातकाल", "अनुच्छेद 352", "अनुच्छेद 368", "गृह मंत्रालय"], "language": "hindi", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948916500-2064_2016_LS_1_1899__2016_7253_Apn_Rply.pdf", "local_pdf_path": "pdfs/f19e4b75-b102-4be8-8c56-26cd01351e83.pdf", "has_pdf": true, "original_filename": "2064_2016_LS_1_1899__2016_7253_Apn_Rply.pdf"}, {"id": "19ff9233-d03c-469e-9976-2ab124da6af4", "category": "Home Affairs", "title": "MP and Minister Salary, Allowances and Pension Rules Information", "department": "Members Salary and Allowances (MSA) Branch, Lok Sabha Secretariat", "ministry": "Ministry of Home Affairs", "state": "Central Government", "date_filed": "2016-10-22", "date_of_response": "2016-11-21", "response_status": "partial_response", "subject": "The applicant sought a break-up of monthly emoluments of MPs, Cabinet Ministers and Ministers of State, and details of MP pension eligibility.", "questions": ["Monthly emolument of MP split up details like basic salary and each and every allowance", "Monthly emoluments of a Cabinet Minister. Split up details like Basic salary and each and every allowance", "Monthly emoluments of a Minister of State. Split up details like Basic salary and each and every allowance", "Is MP or Minister is eligible for pension what is the minimum service to be rendered for full pension eligibility", "What will be pension for a Member of Parliament or Minister?", "Is MP is eligible for pension for every term of 5 years or as the case may be they are eligible for more than one pension?"], "response_summary": "The Secretariat provided information on MP salary and allowances as regulated under the Salary, Allowances and Pension of Members of Parliament Act, 1954, noted that pension of Cabinet/State Ministers does not fall under the MSA Branch, and stated that the query on Ministers' emoluments was transferred to the Ministry of Home Affairs.", "tags": ["MP salary", "MP pension", "Minister emoluments", "MSA Branch", "Salary Allowances and Pension Act 1954"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948905201-2047_2016_LS_1_1883__2016_7236_Apn_Rply.pdf", "local_pdf_path": "pdfs/19ff9233-d03c-469e-9976-2ab124da6af4.pdf", "has_pdf": true, "original_filename": "2047_2016_LS_1_1883__2016_7236_Apn_Rply.pdf"}, {"id": "c09cdbfb-6868-4518-9d6a-5644fdc723a6", "category": "Home Affairs", "title": "RTI on forged signatures on questions attributed to former MP", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-10-19", "date_of_response": "2016-11-23", "response_status": "full_response", "subject": "The applicant asked whether Lok Sabha authorities had investigated who forged questions in the name of former MP Shri Ramsevak Singh, given that the relevant inquiry committee had not identified the culprit.", "questions": ["Has the Hon'ble Speaker Lok Sabha, Secretary-General or anybody from Lok Sabha tried to find out that who has forged the Questions on the name of Shri Ramsevak Singh because Committee to Inquire into allegation of improper conduct on the part of some Members has not tried to find out the culprit. The matter is related to the security of Lok Sabha."], "response_summary": "The Secretariat explained that the Committee to Inquire into Allegations of Improper Conduct had become functus officio after tabling its report in 2005, that no information exists on who forged Shri Ramsewak Singh's signatures, and cited the Committee's questioning of Shri Ramsewak Singh himself on the matter.", "tags": ["forged signatures", "Ramsevak Singh", "improper conduct inquiry committee", "Lok Sabha security"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948882362-2014_2016_LS_1_1854__2016_7203_Apn_Rply.pdf", "local_pdf_path": "pdfs/c09cdbfb-6868-4518-9d6a-5644fdc723a6.pdf", "has_pdf": true, "original_filename": "2014_2016_LS_1_1854__2016_7203_Apn_Rply.pdf"}, {"id": "ddd5b047-2ba8-485c-9d0e-3342273df282", "category": "Home Affairs", "title": "RTI on Parliament Security, Public Gallery and Questions Procedure", "department": "Lok Sabha Secretariat, Information Cell", "ministry": null, "state": "Central Government", "date_filed": "2016-10-15", "date_of_response": "2016-11-30", "response_status": "partial_response", "subject": "The applicant sought information on Parliament House Complex security access regulations, the procedure for the public to watch Lok Sabha proceedings, action taken on Questions raised in Lok Sabha, and who may raise such questions.", "questions": ["[Original question text not reproduced in document] - answered regarding security access regulations for the Parliament House Complex.", "[Original question text not reproduced in document] - answered regarding the procedure to watch the proceedings of the Lok Sabha for a common man.", "[Original question text not reproduced in document] - answered regarding the action taken on the Questions raised in the Lok Sabha.", "[Original question text not reproduced in document] - Question No. 4, no reply recorded.", "[Original question text not reproduced in document] - answered regarding who can raise questions in Lok Sabha.", "[Original question text not reproduced in document] - found vague for a specific reply."], "response_summary": "The Secretariat denied information on Parliament security access regulations under Section 8(1)(a) of the RTI Act, explained the public gallery viewing procedure via an MP-signed application form, stated that action on Lok Sabha Questions is the concerned Ministries' responsibility (partly transferred to Rajya Sabha Secretariat), and clarified that only MPs can raise questions in Lok Sabha while the public may address grievances through elected representatives or the Speaker.", "tags": ["Parliament security", "public gallery", "Lok Sabha Questions", "Section 8(1)(a)", "RTI"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948865413-2001_2016_LS_1_1842__2016_7190_Apn_Rply.pdf", "local_pdf_path": "pdfs/ddd5b047-2ba8-485c-9d0e-3342273df282.pdf", "has_pdf": true, "original_filename": "2001_2016_LS_1_1842__2016_7190_Apn_Rply.pdf"}, {"id": "44a71dba-ff5d-4b24-bb81-d906900611b2", "category": "Home Affairs", "title": "RTI Seeking Service Record Details of a Named LS Secretariat Employee", "department": "Lok Sabha Secretariat, Information Cell", "ministry": null, "state": "Central Government", "date_filed": "2016-10-13", "date_of_response": "2016-12-16", "response_status": "partial_response", "subject": "The applicant sought details of the CRPF service record, promotion dates, pay scale and technical experience of a named Lok Sabha Secretariat employee (S.O. Tech), who had earlier served in CRPF.", "questions": ["Provide me the date of promotion to the post of sub-inspector in CRPF in respect of Smt. Suman Kumari (presently S.O. Tech. In Lok Sabha Secretariat) and pay scale in CRPF on that date as per her Service Book.", "Provide me the date of promotion to the post of inspector in CRPF in respect of Smt. Suman Kumari (presently S.O. Tech. In Lok Sabha Secretariat) and pay scale in CRPF on that date as per her Service Book.", "Provide me the information as regards to length of service with dates as rendered by Smt. Suman Kumari (presently S.O. Tech. In Lok Sabha Secretariat) in the following scales in CRPF as per her Service Book records: a. Rs. 1400-2300 b. Rs. 5000-8000 c. Rs. 5500-9000 d. Rs. 6500-10500", "Provide me the nature of work (General duty or Technical) performed by Smt. Suman Kumari (presently S.O. Tech. In Lok Sabha Secretariat) during her tenure in CRPF.", "Provide me the information on length of experience and in the following areas in respect of Smt. Suman Kumari (presently S.O. Tech. In Lok Sabha Secretariat) being the essential qualification for the post of SSA (T): a. Micro-processor based access control b. CCTV system c. Anti-sabotage equipments d. Computer controlled radio communication system and electronic instruments e. Exposure to latest operating system such as Linux/Windows NT/Novell and RDBMS in LAN/WAN environment"], "response_summary": "The Secretariat denied disclosure of promotion dates, pay scale and length of service details citing Section 8(1)(j) of the RTI Act as personal information unrelated to any public activity, and transferred the query about nature of work/experience to CRPF, the concerned former department.", "tags": ["service record", "CRPF", "personal information exemption", "Section 8(1)(j)", "Lok Sabha Secretariat employee"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948848906-1978_2016_LS_1_1821__2016_7167_Apn_Rply.pdf", "local_pdf_path": "pdfs/44a71dba-ff5d-4b24-bb81-d906900611b2.pdf", "has_pdf": true, "original_filename": "1978_2016_LS_1_1821__2016_7167_Apn_Rply.pdf"}, {"id": "fef8dc84-756a-4bc6-9b43-7dc938e1154a", "category": "Home Affairs", "title": "RTI on Parliament Publications, Bills, POK Resolutions and Debates", "department": "Lok Sabha Secretariat, Information Cell", "ministry": null, "state": "Central Government", "date_filed": "2016-10-03", "date_of_response": "2016-11-04", "response_status": "partial_response", "subject": "The applicant, an inmate of a Central Prison, sought information on un-priced parliamentary publications, religious protocol with neighbouring countries, resolutions and bills on POK/citizenship, the Prevention of Torture Bill, and historical Parliament debates on Hindu Rashtra.", "questions": ["A copy of un-priced publication of Lok Sabha and Rajya Sabha which have been published during June, 2014 onwards.", "Details of current religious protocol of (India-Pakistan), India-Bangladesh, India-Sri Lanka and with other countries.", "Copy of all resolutions of POK passed by Lok Sabha and Rajya Sabha as well as the efforts done by the Govt. of India.", "Brief detail of all bills/acts/amendments which have been passed by Lok Sabha and Rajya Sabha during current NDA Government.", "Why the prevention torture bill not yet been passed.", "Status report of POK as a case in UN and the current status of POK refugees in J&K in respect of their nationality and state citizenship.", "Provide copy of proposed draft of Citizenship (Amendment) bill-2016 and details of JPC on this tenure of JPC.", "Whether any discussion/debate had been taken place in Parliament regarding Hindu Rashtra/Aryawart, during regime of Janata Party in 1977."], "response_summary": "The Secretariat enclosed a brief note on Bills passed in the Sixteenth Lok Sabha and a copy of the Citizenship (Amendment) Bill, 2016, explained the fate of the Prevention of Torture Bill (lapsed on dissolution of the Fifteenth Lok Sabha), and directed the applicant to Rajya Sabha debate archives online or Parliament Library access for historical debate records. Several points were transferred to Rajya Sabha Secretariat and Ministry of Home Affairs as they did not pertain to Lok Sabha Secretariat.", "tags": ["Parliament bills", "POK resolutions", "Prevention of Torture Bill", "Citizenship Amendment Bill", "Parliament debates"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948845612-1976_2016_LS_1_1819__2016_7165_Apn_Rply.pdf", "local_pdf_path": "pdfs/fef8dc84-756a-4bc6-9b43-7dc938e1154a.pdf", "has_pdf": true, "original_filename": "1976_2016_LS_1_1819__2016_7165_Apn_Rply.pdf"}, {"id": "f67f8d2e-046f-4f5e-8f61-7f22afb5a9c9", "category": "Home Affairs", "title": "MP Security and Travel Expenditure Query Rajasthan State", "department": "Information Cell", "ministry": null, "state": "Rajasthan", "date_filed": "2016-09-30", "date_of_response": "2016-10-26", "response_status": "partial_response", "subject": "Applicant sought details of security, domestic travel, and international travel expenditure of MPs from Rajasthan during FY 2014-15.", "questions": ["In the financial year 2014-2015 how many money was spend on security of the MPs of Rajasthan State.", "How much money was spend for domestic travel on MPs of Rajasthan State.", "How much money was spent on Members of Parliament from Rajasthan State for international travel"], "response_summary": "The security expenditure query was transferred online to the Ministry of Home Affairs; domestic travel expenditure was said to be voluminous but accessible on the Lok Sabha website; and international travel of MPs was said to not be handled by the Conference Branch, whose official delegation visit details are available online.", "tags": ["Rajasthan MPs", "MP security expenditure", "MP travel expenses", "Ministry of Home Affairs"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948834871-1920_2016_LS_1_1767__2016_7109_Apn_Rply.pdf", "local_pdf_path": "pdfs/f67f8d2e-046f-4f5e-8f61-7f22afb5a9c9.pdf", "has_pdf": true, "original_filename": "1920_2016_LS_1_1767__2016_7109_Apn_Rply.pdf"}, {"id": "12aab05f-7f72-4df7-a3b6-8b3737fd93bf", "category": "Home Affairs", "title": "MP Security and Travel Expenditure Query Himachal Pradesh", "department": "Information Cell", "ministry": null, "state": "Himachal Pradesh", "date_filed": "2016-09-30", "date_of_response": "2016-10-26", "response_status": "partial_response", "subject": "Applicant sought details of security, domestic travel and international travel expenditure of MPs from Himachal Pradesh during FY 2014-15.", "questions": ["In the financial year 2014-2015 how many money was spend on security of the MPs of Himachal Pradesh State.", "How much money was spend for domestic travel on MPs of Himachal Pradesh State.", "How much money was spend for domestic travel on MPs of Himachal Pradesh State."], "response_summary": "The security expenditure query was transferred online to the Ministry of Home Affairs; domestic travel expenditure was said to be voluminous but accessible on the Lok Sabha website; and international/foreign travel of MPs was said to not be handled by the Conference Branch, whose official delegation visit details are available online.", "tags": ["Himachal Pradesh MPs", "MP security expenditure", "MP travel expenses", "Ministry of Home Affairs"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788948830657-1902_2016_LS_1_1751__2016_7091_Apn_Rply.pdf", "local_pdf_path": "pdfs/12aab05f-7f72-4df7-a3b6-8b3737fd93bf.pdf", "has_pdf": true, "original_filename": "1902_2016_LS_1_1751__2016_7091_Apn_Rply.pdf"}, {"id": "9632cdd9-372c-4550-854e-53e79b3bac22", "category": "Finance", "title": "Daily expenditure on Parliament proceedings and adjournment loss", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-30", "date_of_response": "2017-01-02", "response_status": "partial_response", "subject": "RTI seeking the daily expenditure of normal Lok Sabha/Rajya Sabha proceedings and the financial loss caused by adjournments.", "questions": ["Daily expenditure for one day normal proceedings of Lok Sabha/Rajya Sabha", "If the proceedings adjourned, how much loss occurred by the govt."], "response_summary": "The Secretariat explained that expenditure on Parliament proceedings is incurred by multiple agencies with no specific/exclusive Head of Account, but that head-of-account-wise expenditure from FY 2009-10 to 2015-16 is available on the Lok Sabha website.", "tags": ["Parliament proceedings expenditure", "Lok Sabha budget", "adjournment loss"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949164815-2424_2016_LS_1_2233__2016_7613_Apn_Rply.pdf", "local_pdf_path": "pdfs/9632cdd9-372c-4550-854e-53e79b3bac22.pdf", "has_pdf": true, "original_filename": "2424_2016_LS_1_2233__2016_7613_Apn_Rply.pdf"}, {"id": "889e29ff-6638-4dec-a199-1e493dda49a7", "category": "Finance", "title": "Information on MPs' and ex-MPs' salary, allowances and pension", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-29", "date_of_response": "2017-01-06", "response_status": "full_response", "subject": "RTI seeking information on salary, allowances, pensions and perks of MPs and ex-MPs.", "questions": ["Information regarding MPs, & Ex.MPs Salary, Allowance, pensions, perks etc."], "response_summary": "The Secretariat listed the various Acts and Rules governing MPs' salary, allowances and pension (including the Salary, Allowances and Pension of Members of Parliament Act, 1954) and advised the applicant to refer to these on the Lok Sabha website for full details.", "tags": ["MP salary and pension", "Salary Allowances and Pension Act 1954", "Ex-MP pension"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949163363-2423_2016_LS_1_2232__2016_7612_Apn_Rply.pdf", "local_pdf_path": "pdfs/889e29ff-6638-4dec-a199-1e493dda49a7.pdf", "has_pdf": true, "original_filename": "2423_2016_LS_1_2232__2016_7612_Apn_Rply.pdf"}, {"id": "e575fc9a-00dc-428e-a9e9-579dffa7ca65", "category": "Finance", "title": "Copies of MPs' asset and liability affidavits requested", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-29", "date_of_response": "2017-01-18", "response_status": "partial_response", "subject": "RTI seeking copies of affidavits filed by Members of Parliament regarding their movable and immovable properties, cash and bank deposits for 2016.", "questions": ["Please provide a copy of affidavit filed by Members of Parliament (MPs) of India about their properties (movable and immovable), cash in hand, bank deposit, post office deposit in the year 2016."], "response_summary": "The Secretariat explained that every elected Member must furnish asset and liability declarations within 90 days under the Members of Lok Sabha (Declaration of Assets and Liabilities) Rules, 2004, and that these declarations run into thousands of pages. Copies would be provided on payment of an information fee of approximately Rs. 10,000 (at Rs. 2 per page).", "tags": ["MP assets and liabilities", "asset declaration", "information fee", "Members of Lok Sabha Rules 2004"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949161681-2422_2016_LS_1_2231__2016_7611_Apn_Rply.pdf", "local_pdf_path": "pdfs/e575fc9a-00dc-428e-a9e9-579dffa7ca65.pdf", "has_pdf": true, "original_filename": "2422_2016_LS_1_2231__2016_7611_Apn_Rply.pdf"}, {"id": "21cd7dd9-83bc-422d-bdf3-8bf4b1df524c", "category": "Finance", "title": "Query on number of MPs donating salary for the country", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": null, "date_of_response": "2017-01-24", "response_status": "partial_response", "subject": "RTI asking how many Members of Parliament donate their salary for the country.", "questions": ["How many M.Ps. are donate salary for country."], "response_summary": "The Secretariat noted that the time period for which the information was sought was not mentioned in the RTI application and asked that this be communicated by the applicant before the query could be answered.", "tags": ["MP salary donation", "incomplete application", "clarification sought"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949160356-2421_2016_LS_1_2230__2016_7610_Apn_Rply.pdf", "local_pdf_path": "pdfs/21cd7dd9-83bc-422d-bdf3-8bf4b1df524c.pdf", "has_pdf": true, "original_filename": "2421_2016_LS_1_2230__2016_7610_Apn_Rply.pdf"}, {"id": "2d1f7fcc-4c7e-4b0c-a106-e730ae6ed4b6", "category": "Finance", "title": "MP Kirti Azad's travel expenditure and foreign visit details sought", "department": "Information Cell, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-28", "date_of_response": "2017-01-19", "response_status": "partial_response", "subject": "RTI seeking details of travel expenditure, co-travellers and foreign visit costs of MP Shri Kirti Azad.", "questions": ["Expenditure on travel by Shri Kriti Azad", "Details of person travelled with him except spouse and sons", "Bills reimbursed for his visit to Darbhanga during the period from 1.5.2014 to 28.12.2016", "Information regarding expenditure incurred on foreign visit, purpose of visit and name of countries during the period from 01.05.2014 to 28.12.2016 in respect of Shri Kirti Azad, Member of Parliament."], "response_summary": "MSA Branch stated the requested travel expenditure information was voluminous and invited the applicant to visit the branch by appointment to peruse the register. Conference Branch clarified it does not deal with private foreign travel of MPs, but noted Shri Kirti Azad, MP visited Ottawa for the 12th CPA Canadian Parliamentary Seminar (24-30 May 2015) at an approximate cost of Rs. 9,76,479/-.", "tags": ["MP travel expenses", "Kirti Azad", "foreign visit expenditure", "Conference Branch", "MSA Branch"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949157324-2418_2016_LS_1_2228__2016_7607_Apn_Rply.pdf", "local_pdf_path": "pdfs/2d1f7fcc-4c7e-4b0c-a106-e730ae6ed4b6.pdf", "has_pdf": true, "original_filename": "2418_2016_LS_1_2228__2016_7607_Apn_Rply.pdf"}, {"id": "d8165b35-b74a-443a-a39e-7878efe7148d", "category": "Finance", "title": "Parliament Adjournment, Expenditure and Disciplinary Action Information Sought", "department": "P&AO / Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-09", "date_of_response": "2017-01-20", "response_status": "full_response", "subject": "The applicant sought information on how many times Parliament proceedings were adjourned since May 2014, per-day expenditure on sessions, money lost due to non-functioning of Parliament, Bills passed since May 2014, and disciplinary action against disruptive Members.", "questions": ["How many times proceedings of the House adjourned after May 2014", "Per day expenditure on Parliament proceedings since May 2014.", "Money lost due to non functioning of Parliament during session and also provide information regarding agencies who bear such expenditure.", "Furnish the number of Sessions and names of Bills passed by Lok Sabha since May, 2014 i.e., the time since NDA Government assumed Office.", "The recent conflicts between the Government and the opposition over the issue of demonetisation has affected the functioning of Parliament and had caused hindrance to major developmental works of the country. Do these members get elected to Parliament for protests and demonstrations? Why disciplinary proceedings are not initiated against such members and which authority can take such an action?"], "response_summary": "The Secretariat provided website links for adjournment and session data, explained that session expenditure is incurred by multiple agencies with no single dedicated head of account, attached an unaudited expenditure statement for FY2016-17 (up to Nov 2016), listed ten Sessions held since May 2014 with a table of Bulletin Part-II references for Bills passed, enclosed a list of Bills passed in the Tenth Session, and cited Rules 373, 374 and 374(A) empowering the Speaker to take disciplinary action against disruptive Members.", "tags": ["Parliament adjournment", "session expenditure", "Bills passed 16th Lok Sabha", "disciplinary action Members", "demonetisation"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949149067-2404_2016_LS_1_2216__2016_7593_Apn_Rply.pdf", "local_pdf_path": "pdfs/d8165b35-b74a-443a-a39e-7878efe7148d.pdf", "has_pdf": true, "original_filename": "2404_2016_LS_1_2216__2016_7593_Apn_Rply.pdf"}, {"id": "50944138-4300-498a-bd0e-18c6af219000", "category": "Finance", "title": "MP Salary, Pension and Tax Exemption Information Sought", "department": "Members Salary & Allowances Branch, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-23", "date_of_response": "2017-01-02", "response_status": "full_response", "subject": "The applicant sought information on the salary, pension and other allowances/perquisites of Members of Parliament and whether they enjoy any tax exemption.", "questions": ["Salary and Pension of Members of Parliament and other allowances and perquisites of MPs", "Whether they enjoy any tax exemption, if yes to what extent"], "response_summary": "The Secretariat listed the Acts/Rules governing MP salary, allowances and pension, and clarified that MP salary/allowances are taxed as 'Income from other sources' and are not subject to TDS, requiring Members to pay advance or self-assessment tax.", "tags": ["MP salary and pension", "tax exemption MPs", "RTI Act 2005"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949145693-2398_2016_LS_1_2211__2016_7587_Apn_Rply.pdf", "local_pdf_path": "pdfs/50944138-4300-498a-bd0e-18c6af219000.pdf", "has_pdf": true, "original_filename": "2398_2016_LS_1_2211__2016_7587_Apn_Rply.pdf"}, {"id": "0979d26f-5b35-4166-86db-3d233d3a3173", "category": "Finance", "title": "Parliament Sessions, Expenditure and MP Salary Information Sought", "department": "Table Office / P&AO, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-22", "date_of_response": null, "response_status": "full_response", "subject": "The applicant sought information on the number of Parliament sessions since May 2014, per-day expenditure on sessions, MP salary/allowances/perquisites since May 2014, and the Bills passed since the NDA Government assumed office.", "questions": ["No. of session after May 2014 to till date", "Expenditure during Lok Sabha Session and per day from 2014.", "Salary and other expenses provided to the MPs from May 2014.", "Furnish the names of Bills passed by Lok Sabha since May, 2014 i.e., the time since NDA Government assumed Office."], "response_summary": "The Secretariat provided links to the Lok Sabha website for session details and expenditure figures, listed the applicable Salary/Allowances Acts and Rules for MPs, attached a monthly expenditure statement for November 2016 and a list of the four Government Bills passed during the Tenth Session of the Sixteenth Lok Sabha, and noted no Private Member Bill had been passed till date.", "tags": ["Parliament sessions expenditure", "MP salary and allowances", "Bills passed", "RTI Act 2005"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949140895-2392_2016_LS_1_2205__2016_7581_Apn_Rply.pdf", "local_pdf_path": "pdfs/0979d26f-5b35-4166-86db-3d233d3a3173.pdf", "has_pdf": true, "original_filename": "2392_2016_LS_1_2205__2016_7581_Apn_Rply.pdf"}, {"id": "58f20297-26be-409a-85be-3b76a8bd32a7", "category": "Finance", "title": "MP Expenditure Details and Bills Passed Information Sought", "department": "Members Salary & Allowances Branch, Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-21", "date_of_response": "2017-01-05", "response_status": "full_response", "subject": "The applicant sought details of MP-related expenditure for a one-month period and the names of Bills passed during the ongoing Parliament session.", "questions": ["Furnish each and every details of expenditure w.e.f. 16.11.16 to 16.12.16", "How many Bills were passed in the present Parliament Session and what are their names?"], "response_summary": "The Secretariat stated the consolidated salary and allowances expenditure for MPs during 16.11.2016 to 16.12.2016 was approximately Rs. 20,94,88,232/-, with the monthly statement attached, and listed four Government Bills passed during the Tenth Session of the Sixteenth Lok Sabha; the application was also transferred to Rajya Sabha Secretariat.", "tags": ["MP salary expenditure", "Bills passed", "Lok Sabha Secretariat", "RTI Act 2005"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949135842-2387_2016_LS_1_2201__2016_7576_Apn_Rply.pdf", "local_pdf_path": "pdfs/58f20297-26be-409a-85be-3b76a8bd32a7.pdf", "has_pdf": true, "original_filename": "2387_2016_LS_1_2201__2016_7576_Apn_Rply.pdf"}, {"id": "425a9cdc-75a6-4c24-9a4f-85e8742f4236", "category": "Finance", "title": "Information on Haryana MPs, Salaries and Allowances Sought", "department": "Members Salary & Allowances Branch, Lok Sabha Secretariat", "ministry": null, "state": "Haryana", "date_filed": "2016-12-14", "date_of_response": "2017-01-19", "response_status": "partial_response", "subject": "The applicant sought detailed information about Members of Parliament elected from Haryana, including their names, parties, addresses, phone numbers, salaries, allowances and related facilities.", "questions": ["Name of all the Members of Parliament elected from Haryana", "Name of their respective parties", "Addresses of their official and personal residence", "Addresses of their official and personal offices", "Their all official phone numbers", "Details of e-mail", "Mobile No. of P.A./P.S. of MPs", "Details of Salary and Allowances", "Salary, allowances and other details of the PA/PS and other servant of the MPs serving as Government servant of non Government Servant of the PA.", "Measurement of Govt. Residence, Details T.V. computer, vehicles, servant's room etc.", "Measurement of Offices provided by the govt., Details T.V., computer, Vehicles, servant's room, Number of servant etc.", "Information regarding official vehicle provided to the MPs expenditure on fuel etc.", "Any commodity purchased for the MPs from Government Fund. Date wise bill, quotation etc.", "Details of facilities provided to the current MPs"], "response_summary": "The Secretariat provided links to Lok Sabha website sections containing Members' bio-profiles, contact details and salary rules; noted that mobile numbers of PAs/PS and detailed measurement/vehicle-fuel data are not maintained by the Branch, guided the applicant to inspect records for computer equipment purchase details, and stated that some queries (vehicles/fuel, government residence measurement) were transferred to CPWD/Directorate of Estates or do not pertain to this Secretariat.", "tags": ["Haryana MPs", "Salary and Allowances", "Members of Parliament", "RTI Act 2005"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949126295-2377_2016_LS_1_2191__2016_7566_Apn_Rply.pdf", "local_pdf_path": "pdfs/425a9cdc-75a6-4c24-9a4f-85e8742f4236.pdf", "has_pdf": true, "original_filename": "2377_2016_LS_1_2191__2016_7566_Apn_Rply.pdf"}, {"id": "86332303-bc51-4937-bca9-a6b55870df05", "category": "Finance", "title": "Financial Loss Due to Interruptions in Current Winter Session", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-17", "date_of_response": "2017-01-09", "response_status": "partial_response", "subject": "RTI seeking details of financial loss caused by interruption of the current Winter Session of Parliament.", "questions": ["Details regarding loss on interrupted current winter session"], "response_summary": "The Secretariat explained that no single exclusive Head of Account exists for booking session expenditure, that session-wise figures are not maintained by IFU, but provided a link to Head-of-Account-wise expenditure from FY 2009-10 to 2015-16 and enclosed unaudited expenditure figures from 1.4.2016 to 30.11.2016; the application was also transferred to Rajya Sabha Secretariat on 05.01.2017.", "tags": ["Winter Session loss", "Parliament expenditure", "IFU", "Rajya Sabha Secretariat transfer"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949113436-2365_2016_LS_1_2180__2016_7554_Apn_Rply.pdf", "local_pdf_path": "pdfs/86332303-bc51-4937-bca9-a6b55870df05.pdf", "has_pdf": true, "original_filename": "2365_2016_LS_1_2180__2016_7554_Apn_Rply.pdf"}, {"id": "939159c9-4959-4b9e-a270-7d9518a24c3b", "category": "Finance", "title": "Rules for Penalising MPs for Disrupting Parliament Proceedings", "department": "सूचना प्रकोष्ठ (Information Cell), Lok Sabha Secretariat", "ministry": null, "state": "Central Government", "date_filed": "2016-12-17", "date_of_response": "2017-01-04", "response_status": "full_response", "subject": "RTI asking whether there is a law to fine MPs from ruling and opposition parties for wasteful expenditure caused by disruption of Parliament and delay of critical Bills.", "questions": ["Every time the Parliament is disrupted. Is there a law to fine all the members of opposition as well as ruling party for wasteful expenditure of Tax Payer money leading to delay in critical Bills to be passed."], "response_summary": "The Secretariat cited Rules 373, 374 and 374(A) of the Rules of Procedure and Conduct of Business in Lok Sabha, which provide for withdrawal and suspension of members from the House for disorderly conduct, wilful obstruction of business, and persistent abuse of Rules.", "tags": ["Parliament disruption", "Rules of Procedure", "MP suspension", "Lok Sabha Secretariat"], "language": "english", "pdf_url": "https://uxlqfcmxmusubsuzyfxk.supabase.co/storage/v1/object/public/rti-documents/admin-bulk/1788949098930-2352_2016_LS_1_2167__2016_7541_Apn_Rply.pdf", "local_pdf_path": "pdfs/939159c9-4959-4b9e-a270-7d9518a24c3b.pdf", "has_pdf": true, "original_filename": "2352_2016_LS_1_2167__2016_7541_Apn_Rply.pdf"}];
