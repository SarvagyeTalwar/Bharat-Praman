    // --- Search Component ---
    function BharatPramanSearch({ items, onActionSelect }) {
      const [isOpen, setIsOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [activeSection, setActiveSection] = useState('All');
      const [activeIndex, setActiveIndex] = useState(0);
      const inputRef = useRef(null);

      const availableSections = useMemo(() => {
        const sections = Array.from(new Set(items.map((i) => i.section)));
        return ['All', ...sections];
      }, [items]);

      useEffect(() => {
        if (isOpen) {
          const timeout = setTimeout(() => inputRef.current?.focus(), 60);
          return () => clearTimeout(timeout);
        }
      }, [isOpen]);

      useEffect(() => {
        const handleGlobalKeyDown = (e) => {
          if (
            e.key.toLowerCase() === 'f' &&
            !isOpen &&
            document.activeElement?.tagName !== 'INPUT' &&
            document.activeElement?.tagName !== 'TEXTAREA'
          ) {
            e.preventDefault();
            setIsOpen(true);
          }
          if (e.key === 'Escape' && isOpen) {
            e.preventDefault();
            e.stopPropagation();
            setIsOpen(false);
          }
        };

        window.addEventListener('keydown', handleGlobalKeyDown, true);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown, true);
      }, [isOpen]);

      const filteredItems = useMemo(() => {
        const q = query.trim().toLowerCase();
        return items.filter((item) => {
          const label = item.title.toLowerCase();
          const subtitle = (item.subtitle || '').toLowerCase();
          const matchesQuery = !q || label.includes(q) || subtitle.includes(q);
          const matchesSection = activeSection === 'All' || item.section === activeSection;
          return matchesQuery && matchesSection;
        });
      }, [query, activeSection, items]);

      useEffect(() => {
        setActiveIndex(0);
      }, [query, activeSection]);

      const groupedSections = useMemo(() => {
        const groups = {};
        filteredItems.forEach((item) => {
          if (!groups[item.section]) groups[item.section] = [];
          groups[item.section].push(item);
        });

        return Object.entries(groups).map(([name, items]) => ({
          name,
          items,
        }));
      }, [filteredItems]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (filteredItems.length > 0) {
            setActiveIndex((prev) => (prev + 1) % filteredItems.length);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (filteredItems.length > 0) {
            setActiveIndex((prev) => (prev - 1 + filteredItems.length) % filteredItems.length);
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const selectedItem = filteredItems[activeIndex];
          if (selectedItem) {
            selectedItem.action();
            onActionSelect?.(selectedItem);
            setIsOpen(false);
          }
        }
      };

      const sharedTransition = {
        type: 'tween',
        ease: 'easeOut',
        duration: 0.16,
      };

      return (
        <div className="w-full max-w-xl">
          {/* Collapsed Search Trigger Bar */}
          <motion.button
            key="trigger"
            layoutId="search-box"
            onClick={() => setIsOpen(true)}
            className="group flex h-12 w-full items-center justify-between overflow-hidden rounded-xl border-2 border-stone-300 bg-white px-4 py-2.5 text-stone-600 shadow-[3px_3px_0px_0px_rgba(0,0,0,0.06)] hover:border-stone-800 hover:text-stone-900 transition-all cursor-pointer"
            transition={sharedTransition}
          >
            <div className="flex items-center gap-3">
              <SearchIcon size={17} className="text-stone-400 group-hover:text-stone-800 transition-colors" />
              <span className="text-sm font-medium">Search nodes, entities, or relations...</span>
            </div>
            <kbd className="rounded border border-stone-300 bg-stone-100 px-2 py-0.5 text-xs font-mono font-bold text-stone-600 shadow-sm group-hover:border-stone-400">
              F
            </kbd>
          </motion.button>

          {/* Full Screen Overlay with Correct Layering */}
          <AnimatePresence>
            {isOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                {/* Backdrop: Warm translucent wash instead of dark black */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="fixed inset-0 bg-stone-900/25 backdrop-blur-[2px]"
                  onClick={() => setIsOpen(false)}
                />

                {/* Sharp Center-Aligned Pop-Up Modal */}
                <motion.div
                  key="palette"
                  layoutId="search-box"
                  transition={sharedTransition}
                  className="relative z-10 flex h-auto max-h-[500px] w-full max-w-xl flex-col overflow-hidden rounded-xl border-2 border-stone-800 bg-[#fefefe] shadow-[8px_8px_0px_0px_rgba(28,25,23,0.12)]"
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Header with Search Input & Filter Pills */}
                  <div className="flex items-center border-b border-stone-200 bg-stone-50/70 px-4 py-3">
                    <span className="pr-3 text-stone-500">
                      <SearchIcon size={16} />
                    </span>

                    <input
                      ref={inputRef}
                      type="text"
                      className="w-full bg-transparent text-sm font-medium text-stone-900 placeholder-stone-400 outline-none"
                      placeholder="Search nodes, entities, or relations..."
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      onKeyDown={handleKeyDown}
                    />

                    {/* Clear Button */}
                    {query && (
                      <button
                        type="button"
                        onClick={() => {
                          setQuery('');
                          inputRef.current?.focus();
                        }}
                        className="p-1 mr-1.5 text-stone-400 hover:text-stone-700 transition-colors"
                      >
                        <XIcon size={14} />
                      </button>
                    )}

                    {/* Filter Pills */}
                    <div className="flex items-center gap-1 border-l border-stone-200 pl-2.5 ml-1">
                      {availableSections.map((sec) => (
                        <button
                          key={sec}
                          type="button"
                          onClick={() => setActiveSection(sec)}
                          className={`px-2 py-0.5 text-xs rounded transition-colors ${
                            activeSection === sec
                              ? 'bg-stone-900 text-stone-50 font-medium shadow-sm'
                              : 'text-stone-600 hover:text-stone-900 hover:bg-stone-200/60'
                          }`}
                        >
                          {sec}
                        </button>
                      ))}

                      <kbd className="ml-1 rounded border border-stone-300 bg-stone-100 px-1 py-0.5 text-[10px] font-mono font-bold text-stone-500">
                        Esc
                      </kbd>
                    </div>
                  </div>

                  {/* Results List */}
                  <div className="custom-scrollbar flex-1 overflow-y-auto p-2.5 max-h-[380px]">
                    {filteredItems.length === 0 ? (
                      <div className="py-12 text-center text-xs text-stone-500">
                        No matching entities or relations found for "{query}"
                      </div>
                    ) : (
                      <div className="space-y-3 py-1">
                        {groupedSections.map((section) => (
                          <div key={section.name} className="space-y-1">
                            <h3 className="px-2.5 py-1 text-[11px] font-mono font-bold tracking-wider text-stone-400 uppercase">
                              {section.name}
                            </h3>
                            <div className="space-y-1">
                              {section.items.map((item) => {
                                const globalIndex = filteredItems.findIndex(
                                  (fi) => fi.id === item.id
                                );
                                const isActive = globalIndex === activeIndex;

                                return (
                                  <button
                                    key={item.id}
                                    type="button"
                                    className={`group flex w-full items-center justify-between rounded-lg px-3 py-2 text-left transition-colors ${
                                      isActive
                                        ? 'bg-stone-100 text-stone-900 border border-stone-300'
                                        : 'text-stone-700 hover:bg-stone-50 border border-transparent'
                                    }`}
                                    onMouseEnter={() => setActiveIndex(globalIndex)}
                                    onClick={() => {
                                      item.action();
                                      onActionSelect?.(item);
                                      setIsOpen(false);
                                    }}
                                  >
                                    <div className="flex items-center gap-3">
                                      <span className={isActive ? 'text-stone-900' : 'text-stone-400 group-hover:text-stone-700'}>
                                        {item.icon}
                                      </span>
                                      <div>
                                        <div className="font-medium text-sm leading-tight text-stone-900">
                                          {item.title}
                                        </div>
                                        {item.subtitle && (
                                          <div className="text-xs text-stone-500 mt-0.5">
                                            {item.subtitle}
                                          </div>
                                        )}
                                      </div>
                                    </div>

                                    <div className="flex items-center gap-2">
                                      {item.tag && (
                                        <span className="text-[10px] uppercase px-1.5 py-0.5 rounded border border-stone-300 bg-stone-50 text-stone-600 font-mono tracking-wider">
                                          {item.tag}
                                        </span>
                                      )}
                                      {item.shortcut && (
                                        <kbd className="rounded border border-stone-200 bg-white px-1.5 py-0.5 text-[10px] font-mono text-stone-500">
                                          {item.shortcut}
                                        </kbd>
                                      )}
                                    </div>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </motion.div>
              </div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    // --- Bharat Praman Dataset ---
    const bharatPramanItems = [
      {

          <section className="w-full max-w-4xl mx-auto mt-20 pt-12 border-t border-stone-300/80">
            <div className="text-center max-w-2xl mx-auto mb-10">
              <span className="text-[11px] font-mono uppercase tracking-widest text-stone-500 font-bold">

              </span>
              <h2 className="text-2xl sm:text-3xl font-bold text-stone-900 mt-1">

              <p className="text-xs sm:text-sm text-stone-600 mt-2 leading-relaxed">
                Traditional relational tables flatten reality. We built a native graph database paired with <strong>Graph RAG</strong> so you can ask minute details of any MP or MLA and get answers in milliseconds.

            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {/* Card 1 */}
              <div className="p-5 rounded-xl border border-stone-300 bg-white/90 shadow-[2px_2px_0px_0px_rgba(0,0,0,0.04)] hover:shadow-md hover:border-stone-500 transition-all">
