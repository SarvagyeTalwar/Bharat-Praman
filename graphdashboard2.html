    // --- Search Component with Retro Neobrutalist Polish ---
    function BharatPramanSearch({ items, onActionSelect, externalQueryTrigger }) {
      const [isOpen, setIsOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [activeSection, setActiveSection] = useState('All');
      const [activeIndex, setActiveIndex] = useState(0);
      const inputRef = useRef(null);

      // Handle external clicks from sample pills
      useEffect(() => {
        if (externalQueryTrigger) {
          setQuery(externalQueryTrigger);
          setIsOpen(true);
        }
      }, [externalQueryTrigger]);

      const availableSections = useMemo(() => {
        const sections = Array.from(new Set(items.map((i) => i.section)));
        return ['All', ...sections];
      }, [items]);

      useEffect(() => {
        if (isOpen) {
          const timeout = setTimeout(() => inputRef.current?.focus(), 60);
          return () => clearTimeout(timeout);
        }
      }, [isOpen]);

      useEffect(() => {
        const handleGlobalKeyDown = (e) => {
          if (
            e.key.toLowerCase() === 'f' &&
            !isOpen &&
            document.activeElement?.tagName !== 'INPUT' &&
            document.activeElement?.tagName !== 'TEXTAREA'
          ) {
            e.preventDefault();
            setIsOpen(true);
          }
          if (e.key === 'Escape' && isOpen) {
            e.preventDefault();
            e.stopPropagation();
            setIsOpen(false);
          }
        };

        window.addEventListener('keydown', handleGlobalKeyDown, true);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown, true);
      }, [isOpen]);

      const filteredItems = useMemo(() => {
        const q = query.trim().toLowerCase();
        return items.filter((item) => {
          const label = item.title.toLowerCase();
          const subtitle = (item.subtitle || '').toLowerCase();
          const matchesQuery = !q || label.includes(q) || subtitle.includes(q);
          const matchesSection = activeSection === 'All' || item.section === activeSection;
          return matchesQuery && matchesSection;
        });
      }, [query, activeSection, items]);

      useEffect(() => {
        setActiveIndex(0);
      }, [query, activeSection]);

      const groupedSections = useMemo(() => {
        const groups = {};
        filteredItems.forEach((item) => {
          if (!groups[item.section]) groups[item.section] = [];
          groups[item.section].push(item);
        });

        return Object.entries(groups).map(([name, items]) => ({
          name,
          items,
        }));
      }, [filteredItems]);

      const handleKeyDown = (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (filteredItems.length > 0) {
            setActiveIndex((prev) => (prev + 1) % filteredItems.length);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (filteredItems.length > 0) {
            setActiveIndex((prev) => (prev - 1 + filteredItems.length) % filteredItems.length);
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const selectedItem = filteredItems[activeIndex];
          if (selectedItem) {
            selectedItem.action();
            onActionSelect?.(selectedItem);
            setIsOpen(false);
          }
        }
      };

      const sharedTransition = {
        type: 'tween',
        ease: 'easeOut',
        duration: 0.16,
      };

      return (
        <div className="w-full">
          {/* Collapsed Search Trigger Bar */}
          <motion.button
            key="trigger"
            layoutId="search-box"
            onClick={() => setIsOpen(true)}
            className="group flex h-14 w-full items-center justify-between overflow-hidden rounded-xl border-2 border-stone-900 bg-white px-5 py-3 text-stone-700 shadow-[4px_4px_0px_0px_#1c1917] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[6px_6px_0px_0px_#1c1917] active:translate-x-0 active:translate-y-0 active:shadow-[2px_2px_0px_0px_#1c1917] transition-all cursor-pointer"
            transition={sharedTransition}
          >
            <div className="flex items-center gap-3.5">
              <span className="flex h-8 w-8 items-center justify-center rounded-lg bg-stone-100 text-stone-900 border border-stone-300 group-hover:bg-amber-100 group-hover:border-amber-400 transition-colors">
                <SearchIcon size={16} />
              </span>
              <span className="text-sm font-semibold text-stone-700 group-hover:text-stone-950 font-mono-retro">
                Ask a question about MLAs, MPs or Ministries...
              </span>
            </div>
            <div className="flex items-center gap-1.5">
              <kbd className="rounded border-2 border-stone-800 bg-stone-100 px-2 py-0.5 text-xs font-mono-retro font-bold text-stone-900 shadow-[1.5px_1.5px_0px_0px_#1c1917]">
                F
              </kbd>
            </div>
          </motion.button>

          {/* Full Screen Overlay with Correct Layering */}
          <AnimatePresence>
            {isOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                {/* Backdrop: Warm translucent wash */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="fixed inset-0 bg-stone-900/35 backdrop-blur-[2px]"
                  onClick={() => setIsOpen(false)}
                />

                {/* Sharp Center-Aligned Pop-Up Modal */}
                <motion.div
                  key="palette"
                  layoutId="search-box"
                  transition={sharedTransition}
                  className="relative z-10 flex h-auto max-h-[520px] w-full max-w-2xl flex-col overflow-hidden rounded-2xl border-2 border-stone-900 bg-[#fdfdfb] shadow-[8px_8px_0px_0px_#1c1917]"
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Header with Search Input & Filter Pills */}
                  <div className="flex items-center border-b-2 border-stone-800 bg-[#f7f3ea] px-4 py-3">
                    <span className="pr-3 text-stone-700">
                      <SearchIcon size={17} />
                    </span>

                    <input
                      ref={inputRef}
                      type="text"
                      className="w-full bg-transparent text-sm font-semibold text-stone-900 placeholder-stone-400 outline-none font-mono-retro"
                      placeholder="Type query (e.g., Lok Sabha, Freedom Fighter, Terms)..."
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      onKeyDown={handleKeyDown}
                    />

                    {/* Clear Button */}
                    {query && (
                      <button
                        type="button"
                        onClick={() => {
                          setQuery('');
                          inputRef.current?.focus();
                        }}
                        className="p-1 mr-1.5 text-stone-400 hover:text-stone-900 transition-colors"
                      >
                        <XIcon size={14} />
                      </button>
                    )}

                    {/* Filter Pills */}
                    <div className="flex items-center gap-1 border-l-2 border-stone-300 pl-2.5 ml-1">
                      {availableSections.map((sec) => (
                        <button
                          key={sec}
                          type="button"
                          onClick={() => setActiveSection(sec)}
                          className={`px-2 py-0.5 text-xs font-mono-retro font-bold rounded transition-all ${
                            activeSection === sec
                              ? 'bg-stone-900 text-stone-50 shadow-[1.5px_1.5px_0px_0px_#78716c]'
                              : 'text-stone-600 hover:text-stone-950 hover:bg-stone-200'
                          }`}
                        >
                          {sec}
                        </button>
                      ))}

                      <kbd className="ml-1 rounded border border-stone-400 bg-white px-1.5 py-0.5 text-[10px] font-mono-retro font-bold text-stone-600 shadow-sm">
                        ESC
                      </kbd>
                    </div>
                  </div>

                  {/* Results List */}
                  <div className="custom-scrollbar flex-1 overflow-y-auto p-3 max-h-[380px] bg-[#fdfdfb]">
                    {filteredItems.length === 0 ? (
                      <div className="py-12 text-center text-xs font-mono-retro text-stone-500">
                        // No matching graph entities found for "{query}"
                      </div>
                    ) : (
                      <div className="space-y-3.5 py-1">
                        {groupedSections.map((section) => (
                          <div key={section.name} className="space-y-1.5">
                            <h3 className="px-2.5 py-1 text-[11px] font-mono-retro font-bold tracking-wider text-stone-500 uppercase flex items-center gap-2">
                              <span>■ {section.name}</span>
                              <span className="flex-1 h-px bg-stone-200"></span>
                            </h3>
                            <div className="space-y-1">
                              {section.items.map((item) => {
                                const globalIndex = filteredItems.findIndex(
                                  (fi) => fi.id === item.id
                                );
                                const isActive = globalIndex === activeIndex;

                                return (
                                  <button
                                    key={item.id}
                                    type="button"
                                    className={`group flex w-full items-center justify-between rounded-lg px-3.5 py-2.5 text-left transition-all ${
                                      isActive
                                        ? 'bg-amber-100/70 text-stone-950 border border-stone-900 shadow-[2px_2px_0px_0px_#1c1917]'
                                        : 'text-stone-700 hover:bg-stone-100 border border-transparent'
                                    }`}
                                    onMouseEnter={() => setActiveIndex(globalIndex)}
                                    onClick={() => {
                                      item.action();
                                      onActionSelect?.(item);
                                      setIsOpen(false);
                                    }}
                                  >
                                    <div className="flex items-center gap-3">
                                      <span className={`p-1 rounded ${isActive ? 'bg-amber-200 text-stone-900' : 'bg-stone-100 text-stone-500 group-hover:text-stone-800'}`}>
                                        {item.icon}
                                      </span>
                                      <div>
                                        <div className="font-bold text-sm leading-tight text-stone-900">
                                          {item.title}
                                        </div>
                                        {item.subtitle && (
                                          <div className="text-xs font-mono-retro text-stone-500 mt-0.5">
                                            {item.subtitle}
                                          </div>
                                        )}
                                      </div>
                                    </div>

                                    <div className="flex items-center gap-2">
                                      {item.tag && (
                                        <span className="text-[10px] uppercase px-1.5 py-0.5 rounded border border-stone-300 bg-white text-stone-700 font-mono-retro font-bold tracking-wider">
                                          {item.tag}
                                        </span>
                                      )}
                                      {item.shortcut && (
                                        <kbd className="rounded border border-stone-300 bg-white px-1.5 py-0.5 text-[10px] font-mono-retro font-bold text-stone-600 shadow-sm">
                                          {item.shortcut}
                                        </kbd>
                                      )}
                                    </div>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Modal Footer Tip */}
                  <div className="border-t border-stone-200 bg-stone-100/80 px-4 py-2 text-[11px] font-mono-retro text-stone-500 flex justify-between items-center">
                    <span>Use ↑ ↓ to navigate</span>
                    <span>Press ↵ to select</span>
                  </div>
                </motion.div>
              </div>
            )}
          </AnimatePresence>
        </div>
      );
    }
